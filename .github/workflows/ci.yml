name: Verify Sheet Patch
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: npm test && npm run check:syntax
      - name: Record synthetic benchmark and renderer
        run: python scripts/benchmark.py --out benchmark-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-evidence-py${{ matrix.python }}
          path: benchmark-ci.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      UI_ARTIFACT_DIR: browser-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check renderer after browser font dependencies
        run: |
          pdftoppm -v
          python -m sheet_patch demo --out /tmp/sheet-patch-renderer-input
          python -m sheet_patch plan /tmp/sheet-patch-renderer-input/old.pdf /tmp/sheet-patch-renderer-input/new.pdf --out /tmp/sheet-patch-renderer-packet --dpi 144
          fc-match Helvetica
      - name: Mock race and responsive checks (Chromium sandbox enabled)
        run: npm run test:browser
      - name: Real worker, PDFs, previews and ZIP (Chromium sandbox enabled)
        run: npm run test:browser:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-artifacts/
          if-no-files-found: ignore
